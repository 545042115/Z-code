// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Force older AndroidX versions compatible with compileSdk 33 (AGP 7.4.2 limit)
    configurations.all {
        resolutionStrategy {
            force 'androidx.activity:activity:1.6.1'
            force 'androidx.activity:activity-ktx:1.6.1'
            force 'androidx.core:core:1.9.0'
            force 'androidx.core:core-ktx:1.9.0'
            force 'androidx.webkit:webkit:1.6.1'
            force 'androidx.annotation:annotation-experimental:1.3.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
