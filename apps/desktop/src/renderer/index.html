<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
  <title>Ziner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div class="titlebar-drag-region">
        <div class="titlebar-brand">
          <div class="brand-mark">Z</div>
          <span class="brand-name">Ziner</span>
        </div>
      </div>
      <div class="titlebar-controls">
        <button id="win-minimize" class="win-btn" title="Minimize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="4.5" width="8" height="1" fill="currentColor"/></svg>
        </button>
        <button id="win-maximize" class="win-btn" title="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button id="win-close" class="win-btn win-close" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <nav id="nav">
      <button data-view="main" data-tooltip="nav.main">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Main</span>
      </button>
      <button data-view="chat" data-tooltip="nav.chat">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Chat</span>
      </button>
      <button data-view="trace" data-tooltip="nav.trace">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Trace</span>
      </button>
      <button data-view="memory" data-tooltip="nav.memory">
        <span class="nav-icon">🧠</span>
        <span class="nav-label">Memory</span>
      </button>
      <button data-view="benchmarks" data-tooltip="nav.benchmarks">
        <span class="nav-icon">🧪</span>
        <span class="nav-label">Benchmarks</span>
      </button>
      <button data-view="settings" data-tooltip="nav.settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>
    <main id="main"></main>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
