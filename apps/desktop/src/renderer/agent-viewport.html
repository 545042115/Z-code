<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Viewport</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #111; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #ccc; }

/* Screencast mode */
#screencast-container {
  display: none;
  width: 100%;
  height: 100%;
  background: #000;
}
#screencast-container.active {
  display: flex;
  align-items: center;
  justify-content: center;
}
#screencast-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* Activity mode */
#activity-container {
  display: flex;
  flex-direction: column;
  height: 100%;
}
#activity-container.screencast-mode {
  display: none;
}

#activity-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: #1a1a1a;
  border-bottom: 1px solid #333;
  font-size: 12px;
  font-weight: 600;
  color: #888;
  flex-shrink: 0;
}
#activity-header .agent-badge {
  display: flex;
  align-items: center;
  gap: 6px;
}
#activity-header .agent-badge .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4caf50;
  display: inline-block;
}
#activity-header .agent-badge .dot.idle {
  background: #666;
}

#activity-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
#activity-list::-webkit-scrollbar { width: 4px; }
#activity-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

.activity-entry {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 4px 10px;
  font-size: 12px;
  line-height: 1.4;
  border-bottom: 1px solid #1a1a1a;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.activity-icon { font-size: 14px; flex-shrink: 0; }
.activity-agent {
  font-weight: 600;
  color: #7c4dff;
  flex-shrink: 0;
  min-width: 50px;
  font-size: 11px;
}
.activity-time {
  color: #555;
  font-size: 10px;
  flex-shrink: 0;
  min-width: 48px;
}
.activity-message {
  color: #ccc;
  word-break: break-word;
  flex: 1;
}
.activity-detail {
  color: #666;
  font-size: 11px;
  display: block;
  margin-top: 1px;
}

/* Placeholder when no activity */
#placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #444;
  font-size: 13px;
  gap: 8px;
}
#placeholder .big-icon { font-size: 32px; opacity: 0.3; }
</style>
</head>
<body>
<div id="screencast-container">
  <img id="screencast-img" alt="Browser viewport">
</div>
<div id="activity-container">
  <div id="activity-header">
    <div class="agent-badge">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Idle</span>
    </div>
    <span id="agent-count">0 agents active</span>
  </div>
  <div id="activity-list"></div>
</div>
<div id="placeholder">
  <div class="big-icon">&#x1F916;</div>
  <div>Waiting for agent activity...</div>
</div>

<script>
const { ipcRenderer } = require('electron');

const screencastContainer = document.getElementById('screencast-container');
const screencastImg = document.getElementById('screencast-img');
const activityContainer = document.getElementById('activity-container');
const activityList = document.getElementById('activity-list');
const placeholder = document.getElementById('placeholder');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const agentCount = document.getElementById('agent-count');

const activeAgents = new Set();
const MAX_ENTRIES = 200;

// Listen for screencast frames
ipcRenderer.on('z:on-browser-preview', (_event, b64) => {
  if (b64 && b64.length > 0) {
    screencastImg.src = 'data:image/jpeg;base64,' + b64;
  }
});

// Listen for viewport mode changes
ipcRenderer.on('z:viewport-mode', (_event, mode) => {
  if (mode === 'screencast') {
    screencastContainer.classList.add('active');
    activityContainer.classList.add('screencast-mode');
    placeholder.style.display = 'none';
    statusDot.className = 'dot';
    statusText.textContent = 'Browser Active';
  } else {
    screencastContainer.classList.remove('active');
    activityContainer.classList.remove('screencast-mode');
    statusDot.className = 'dot idle';
    statusText.textContent = 'Idle';
  }
});

// Listen for agent activity
ipcRenderer.on('z:on-agent-activity', (_event, data) => {
  const { agent, icon, message, detail } = data;
  placeholder.style.display = 'none';
  screencastContainer.classList.remove('active');
  activityContainer.classList.remove('screencast-mode');

  // Track active agents
  if (agent !== 'system' && agent !== 'router') {
    activeAgents.add(agent);
  }
  agentCount.textContent = activeAgents.size > 0
    ? `${activeAgents.size} agent${activeAgents.size > 1 ? 's' : ''} active`
    : '0 agents active';
  statusDot.className = 'dot';
  statusText.textContent = activeAgents.size > 0
    ? `${[...activeAgents].join(', ')} working`
    : 'Active';

  const time = new Date().toLocaleTimeString();
  const entry = document.createElement('div');
  entry.className = 'activity-entry';
  entry.innerHTML = `
    <span class="activity-icon">${escapeHtml(icon)}</span>
    <span class="activity-agent">${escapeHtml(agent)}</span>
    <span class="activity-time">${escapeHtml(time)}</span>
    <span class="activity-message">${escapeHtml(message)}${detail ? `<span class="activity-detail">${escapeHtml(detail)}</span>` : ''}</span>
  `;
  activityList.appendChild(entry);
  activityList.scrollTop = activityList.scrollHeight;

  // Trim old entries
  while (activityList.children.length > MAX_ENTRIES) {
    activityList.removeChild(activityList.firstChild);
  }
});

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
